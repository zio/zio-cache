# This file was autogenerated using `zio-sbt-ci` plugin via `sbt ciGenerateGithubWorkflow`
# task and should be included in the git repository. Please do not edit it manually.

name: CI
env:
  JDK_JAVA_OPTIONS: -XX:+PrintCommandLineFlags
'on':
  workflow_dispatch: {}
  release:
    types:
    - published
  push:
    branches:
    - master
  pull_request:
    branches-ignore:
    - gh-pages
permissions:
  id-token: write
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.run_id || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
    - name: Git Checkout
      uses: actions/checkout@v7.0.1
      with:
        fetch-depth: '0'
    - name: Install libuv
      run: sudo apt-get update && sudo apt-get install -y libuv1-dev
    - name: Setup Scala
      uses: actions/setup-java@v5.7.0
      with:
        distribution: corretto
        java-version: '8'
        check-latest: true
    - name: Setup SBT
      uses: sbt/setup-sbt@v1.5.7
    - name: Cache Dependencies
      uses: coursier/cache-action@v8.1.1
    - name: Check all code compiles
      run: sbt --no-colors +Test/compile
    - name: Check artifacts build process
      run: sbt --no-colors +publishLocal
    - name: Check Document Generation
      run: sbt docs/docusaurusCreateSite
  lint:
    name: Lint
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
    - name: Git Checkout
      uses: actions/checkout@v7.0.1
      with:
        fetch-depth: '0'
    - name: Install libuv
      run: sudo apt-get update && sudo apt-get install -y libuv1-dev
    - name: Setup Scala
      uses: actions/setup-java@v5.7.0
      with:
        distribution: corretto
        java-version: '8'
        check-latest: true
    - name: Setup SBT
      uses: sbt/setup-sbt@v1.5.7
    - name: Cache Dependencies
      uses: coursier/cache-action@v8.1.1
    - name: Check if the site workflow is up to date
      run: sbt --no-colors ciCheckGithubWorkflow
    - name: Lint
      run: sbt --no-colors check
  test:
    name: Test
    runs-on: ubuntu-latest
    continue-on-error: false
    strategy:
      fail-fast: false
      matrix:
        java:
        - '8'
        - '11'
        scala-project:
        - ++2.11.12 zioCacheJS
        - ++2.12.14 zioCacheJS
        - ++2.13.6 zioCacheJS
        - ++2.11.12 zioCacheNative
        - ++2.12.14 zioCacheNative
        - ++2.13.6 zioCacheNative
        - ++2.11.12 zioCacheJVM
        - ++2.12.14 zioCacheJVM
        - ++2.13.6 zioCacheJVM
        - ++3.0.0 zioCacheJVM
    steps:
    - name: Install libuv
      run: sudo apt-get update && sudo apt-get install -y libuv1-dev
    - name: Setup Scala
      uses: actions/setup-java@v5.7.0
      with:
        distribution: corretto
        java-version: ${{ matrix.java }}
        check-latest: true
    - name: Setup SBT
      uses: sbt/setup-sbt@v1.5.7
    - name: Cache Dependencies
      uses: coursier/cache-action@v8.1.1
    - name: Git Checkout
      uses: actions/checkout@v7.0.1
      with:
        fetch-depth: '0'
    - name: Test
      run: sbt --no-colors ${{ matrix.scala-project }}/test
  ci:
    name: ci
    runs-on: ubuntu-latest
    continue-on-error: false
    needs:
    - lint
    - test
    - build
    if: always()
    steps:
    - name: Report Failed CI
      if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
      run: 'echo "ci failed: one or more required jobs did not succeed"; exit 1'
    - name: Report Successful CI
      run: echo "ci passed"
  release:
    name: Release
    runs-on: ubuntu-latest
    continue-on-error: false
    needs:
    - ci
    if: ${{ (((github.event_name == 'release') && (github.event.action == 'published')) || (github.event_name == 'workflow_dispatch')) || ((github.event_name == 'push') && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) }}
    steps:
    - name: Git Checkout
      uses: actions/checkout@v7.0.1
      with:
        fetch-depth: '0'
    - name: Install libuv
      run: sudo apt-get update && sudo apt-get install -y libuv1-dev
    - name: Setup Scala
      uses: actions/setup-java@v5.7.0
      with:
        distribution: corretto
        java-version: '8'
        check-latest: true
    - name: Setup SBT
      uses: sbt/setup-sbt@v1.5.7
    - name: Cache Dependencies
      uses: coursier/cache-action@v8.1.1
    - name: Release
      run: sbt --no-colors ci-release
      env:
        PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
        PGP_SECRET: ${{ secrets.PGP_SECRET }}
        SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
        SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
